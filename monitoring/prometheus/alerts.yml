groups:
  - name: trading-lab
    rules:
      - alert: TradingServiceDown
        expr: up{job=~"market-data|strategy-engine|api-gateway|kafka"} == 0
        for: 15s
        labels:
          severity: critical
        annotations:
          summary: 'Trading service {{ $labels.job }} is unreachable'
      - alert: StaleStrategyData
        expr: strategy_last_tick_age_seconds > 10
        for: 10s
        labels:
          severity: warning
        annotations:
          summary: Strategy has not processed fresh market data
      - alert: KafkaConsumerBacklog
        expr: sum(kafka_consumergroup_lag{consumergroup="strategy-engine-v1"}) > 10
        for: 15s
        labels:
          severity: warning
        annotations:
          summary: Strategy consumer is falling behind

      - alert: StrategySequenceBlocked
        expr: strategy_symbol_sequence_blocked == 1
        for: 5s
        labels:
          severity: critical
        annotations:
          summary: 'Sequence recovery is required for {{ $labels.symbol }}'
          runbook: docs/operations/priority-2.md

  - name: market-data-feed-reliability
    rules:
      - alert: MarketDataFeedStale
        expr: feed_stale{job="market-data-network"} == 1
        for: 5s
        labels:
          severity: warning
          component: multicast-feed
        annotations:
          summary: "Market-data multicast feed is stale"
          description: "No valid market-data packets have been received within the receiver's stale threshold."

      - alert: MarketDataUnresolvedGap
        expr: feed_unresolved_gaps{job="market-data-network"} > 0
        for: 10s
        labels:
          severity: critical
          component: multicast-feed
        annotations:
          summary: "Unresolved market-data sequence gap detected"
          description: "One or more missing market-data sequences remain unresolved."

      - alert: MarketDataExporterDown
        expr: up{job="market-data-network"} == 0
        for: 30s
        labels:
          severity: critical
          component: multicast-feed
        annotations:
          summary: "Market-data feed metrics exporter is unreachable"
          description: "Prometheus cannot scrape the multicast feed receiver metrics endpoint."
