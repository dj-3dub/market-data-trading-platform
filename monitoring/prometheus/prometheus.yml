global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    platform: trading-observability

rule_files:
  - /etc/prometheus/alerts.yml
  - /etc/prometheus/slo.yml

scrape_configs:
  - job_name: reliability-probe
    static_configs:
      - targets: ["reliability-probe:8010"]
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "market-data"
    static_configs:
      - targets: ["market-data:7001"]

  - job_name: "strategy-engine"
    static_configs:
      - targets: ["strategy-engine:7002"]

  - job_name: "api-gateway"
    static_configs:
      - targets: ["api-gateway:8000"]

  - job_name: "kafka"
    static_configs:
      - targets: ["kafka-exporter:9308"]

  # Wacker-Watch eBPF off-CPU duration agent.
  # The agent can run two ways, so both are scraped:
  #   wacker-watch:8001          -> agent running as a container on trading-net
  #                                 (make agent-up)
  #   host.docker.internal:8001  -> agent running natively on the Docker host
  #                                 (make agent-run, the recommended path)
  # Whichever target is not in use simply reports as down.
  - job_name: "wacker-watch"
    metrics_path: /metrics
    honor_labels: true
    static_configs:
      - targets: ["wacker-watch:8001", "host.docker.internal:8001"]
        labels:
          signal: kernel-off-cpu
