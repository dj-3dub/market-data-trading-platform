apiVersion: 1

datasources:
  - name: Prometheus
    # uid must be pinned. Without it Grafana generates a fresh random uid on
    # every first boot, so any dashboard referencing a hardcoded uid renders
    # "datasource not found" on every new machine.
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
